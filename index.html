<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Links — Koleksi Link AI Terbaikku</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- HEADER -->
  <header class="site-header">
    <div class="container">
      <div class="header-inner">
        <div class="logo">
          <span class="logo-icon">✦</span>
          <span class="logo-text">AI Links</span>
        </div>
        <p class="header-tagline">Koleksi link AI tools favoritku</p>
        <button class="btn-add" id="btnOpenModal" aria-label="Tambah link baru">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Tambah Link
        </button>
      </div>
    </div>
  </header>

  <!-- SEARCH + FILTER -->
  <div class="controls-bar">
    <div class="container">
      <div class="controls-inner">
        <div class="search-wrap">
          <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="searchInput" class="search-input" placeholder="Cari AI tools..." />
        </div>
        <div class="filter-tags" id="filterTags">
          <button class="tag-btn active" data-cat="all">Semua</button>
          <button class="tag-btn" data-cat="chat">Chat</button>
          <button class="tag-btn" data-cat="gambar">Gambar</button>
          <button class="tag-btn" data-cat="kode">Kode</button>
          <button class="tag-btn" data-cat="produktivitas">Produktivitas</button>
          <button class="tag-btn" data-cat="riset">Riset</button>
          <button class="tag-btn" data-cat="audio">Audio</button>
          <button class="tag-btn" data-cat="video">Video</button>
          <button class="tag-btn" data-cat="lainnya">Lainnya</button>
        </div>
      </div>
    </div>
  </div>

  <!-- MAIN GRID -->
  <main class="main-content">
    <div class="container">
      <div class="links-grid" id="linksGrid"></div>
      <div class="empty-state" id="emptyState" style="display:none;">
        <span class="empty-icon">✦</span>
        <p>Belum ada link yang cocok.</p>
        <button class="btn-add small" id="btnOpenModalEmpty">Tambah Link Pertama</button>
      </div>
    </div>
  </main>

  <!-- STATS -->
  <div class="stats-bar">
    <div class="container">
      <span id="statsText" class="stats-text">0 links tersimpan</span>
    </div>
  </div>

  <!-- MODAL -->
  <div class="modal-overlay" id="modalOverlay" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-header">
        <h2 id="modalTitle">Tambah Link Baru</h2>
        <button class="modal-close" id="btnCloseModal" aria-label="Tutup modal">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label for="inputName">Nama AI</label>
          <input type="text" id="inputName" placeholder="Contoh: Claude, ChatGPT, Midjourney..." />
        </div>
        <div class="form-group">
          <label for="inputUrl">URL / Link</label>
          <input type="url" id="inputUrl" placeholder="https://..." />
        </div>
        <div class="form-group">
          <label for="inputCategory">Kategori</label>
          <select id="inputCategory">
            <option value="chat">💬 Chat</option>
            <option value="gambar">🎨 Gambar</option>
            <option value="kode">💻 Kode</option>
            <option value="produktivitas">⚡ Produktivitas</option>
            <option value="riset">🔍 Riset</option>
            <option value="audio">🎵 Audio</option>
            <option value="video">🎬 Video</option>
            <option value="lainnya">✨ Lainnya</option>
          </select>
        </div>
        <div class="form-group">
          <label for="inputDesc">Keterangan Singkat</label>
          <textarea id="inputDesc" rows="3" placeholder="Apa yang bisa dilakukan AI ini? Kenapa kamu suka?"></textarea>
        </div>
        <div class="form-group">
          <label for="inputEmoji">Emoji (opsional)</label>
          <input type="text" id="inputEmoji" placeholder="🤖" maxlength="4" />
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-cancel" id="btnCancelModal">Batal</button>
        <button class="btn-save" id="btnSaveLink">Simpan Link</button>
      </div>
    </div>
  </div>

  <!-- TOAST -->
  <div class="toast" id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
